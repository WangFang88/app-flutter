org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
kotlin.incremental=true
# 禁用资源混淆，否则 getIdentifier() 找不到自定义通知声音
android.enableResourceObfuscation=false
# 添加超时配置
org.gradle.connectionTimeout=60000
org.gradle.daemon.idletimeout=120000